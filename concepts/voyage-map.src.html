<meta charset="utf-8">
<title>대항해 리서치 해도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 위 단계 막대 / 왼쪽 함대 목록 · 가운데 세계 해도 · 오른쪽 질문·지표·항해 일지. 좁으면 해도 → 함대 → 질문 순으로 쌓는다.
   전략 게임 상황판 같은 어두운 청록 패널에 금색 테두리, 해도는 양피지 육지 위에 명조 지명. 한 가지 어두운 톤으로 고정. */
:root{
  --bg:#0c1215; --panel:#142027; --panel2:#1b2b33; --inset:#0f181d;
  --gold:#c9a45c; --gold-dim:#6f5d3b; --fg:#efe6d2; --muted:#a59c88;
  --danger:#e8573f; --ok:#86c97c; --paper:#f3e9cf; --ink:#2b2013;
  --f-serif:'Nanum Myeongjo','Batang',serif;
  --f-body:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
button,input{font:inherit;color:inherit}
.app{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:clamp(660px,calc(100vh - 32px),940px);border:1px solid var(--gold-dim);border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 3px #080c0e,0 0 0 4px var(--gold-dim)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:8px 14px;background:linear-gradient(#1e3039,#132028);border-bottom:1px solid var(--gold-dim)}
.crest{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#3a5664,#1a2a31);border:1px solid var(--gold);color:var(--gold);font-size:18px}
.ttl b{font-family:var(--f-serif);font-weight:800;font-size:19px;letter-spacing:.02em}
.stages{display:flex;gap:4px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.stages li{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid #2f434c;color:var(--muted);white-space:nowrap}
.stages li.done{color:var(--fg);border-color:#43575f}
.stages li.now{background:var(--gold);border-color:var(--gold);color:#17120a;font-weight:700}
.res{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.res div{display:flex;gap:6px;align-items:baseline;background:var(--inset);border:1px solid #2b3d46;border-radius:4px;padding:4px 9px;font-size:12px;color:var(--muted)}
.res b{color:var(--fg);font-size:14px;font-variant-numeric:tabular-nums}
.side{background:linear-gradient(#152229,#101a1f);overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.outliner{border-right:1px solid var(--gold-dim)}
.panel{border-left:1px solid var(--gold-dim)}
h2{font-family:var(--f-serif);font-weight:800;font-size:13px;color:var(--gold);letter-spacing:.08em;margin:0;padding:9px 12px 7px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent)}
.box{padding:0 12px 12px}
.fleets{display:grid;gap:8px;padding:0 10px 12px}
.fleet{background:var(--panel2);border:1px solid #2c3f48;border-left:4px solid var(--c);border-radius:4px;padding:8px 9px;cursor:pointer;display:grid;gap:4px;text-align:left}
.fleet:hover{border-color:var(--gold-dim);border-left-color:var(--c)}
.fleet .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fleet b{font-family:var(--f-serif);font-size:14px}
.fleet .sec{font-size:12.5px;line-height:1.35}
.fleet small{color:var(--muted);font-size:11.5px;line-height:1.4}
.st{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid #3b5059;color:var(--muted);white-space:nowrap}
.st.run{color:var(--gold);border-color:var(--gold)} .st.ok{color:var(--ok);border-color:var(--ok)} .st.bad{color:var(--danger);border-color:var(--danger)}
.cargo{display:flex;flex-wrap:wrap;gap:3px}
.cargo span{font-size:11px;background:var(--inset);border-radius:3px;padding:1px 6px}
.cargo span.dup{color:#ffb3a6;outline:1px solid var(--danger)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--c);opacity:.95}
.pips i.used{opacity:.22}
.mapwrap{position:relative;min-width:0;min-height:0;background:#1d4a5e}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.ctrl{position:absolute;display:flex;gap:4px;background:rgba(12,20,24,.84);border:1px solid var(--gold-dim);border-radius:5px;padding:4px;align-items:center;z-index:2}
.ctrl button{background:transparent;border:1px solid transparent;border-radius:3px;min-width:30px;height:28px;cursor:pointer;color:var(--fg);font-size:13px;padding:0 6px}
.ctrl button:hover{border-color:var(--gold-dim)}
.ctrl button[aria-pressed="true"]{background:var(--gold);color:#17120a;font-weight:700}
.ctrl label{font-size:12px;display:flex;gap:5px;align-items:center;padding:0 6px;cursor:pointer;white-space:nowrap}
.speed{left:calc(10px + env(safe-area-inset-left,0px));bottom:10px}
.zoom{right:10px;bottom:10px}
.layers{left:10px;top:10px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.tip{position:absolute;pointer-events:none;background:rgba(20,16,10,.95);border:1px solid var(--gold);border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:270px;z-index:3}
.tip b{font-family:var(--f-serif);font-size:15px;display:block}
.tip span{color:var(--muted)}
.event{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(390px,calc(100% - 24px));background:linear-gradient(#2a2216,#1c160d);border:1px solid var(--gold);outline:3px double rgba(201,164,92,.35);outline-offset:-7px;border-radius:4px;padding:12px 16px 13px;z-index:4;box-shadow:0 8px 30px rgba(0,0,0,.55)}
.event b{display:block;font-family:var(--f-serif);font-weight:800;font-size:17px;color:var(--gold);margin-bottom:4px}
.event p{margin:0;font-size:13px;line-height:1.55}
.event.alarm{border-color:var(--danger);background:linear-gradient(#3a1a14,#21100c)}
.event.alarm b{color:#ff8a73}
.doc{position:absolute;inset:48px 12px 52px;z-index:5;background:var(--paper);color:var(--ink);border:1px solid #8d7445;outline:4px double rgba(120,90,40,.45);outline-offset:-10px;border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.6);overflow-y:auto;padding:26px clamp(18px,4vw,44px) 30px}
.doc header{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid #b9a172;padding-bottom:10px;margin-bottom:14px}
.doc h3{font-family:var(--f-serif);font-weight:800;font-size:clamp(18px,2.2vw,24px);margin:0;line-height:1.35;text-wrap:balance}
.doc .meta{font-size:12px;color:#6a5a3c;margin-top:4px}
.doc button.close{background:#2b2013;color:var(--paper);border:0;border-radius:3px;padding:6px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.doc section{margin:0 0 18px;max-width:78ch}
.doc h4{font-family:var(--f-serif);font-weight:800;font-size:16px;margin:0 0 2px;display:flex;gap:8px;align-items:center}
.doc h4 i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.doc .who{font-size:12px;color:#6a5a3c;margin-bottom:6px}
.doc p{margin:0 0 7px;font-size:13.5px;line-height:1.65}
.doc p q{font-style:italic;quotes:none;color:#3d301c}
.doc p .cite{font-weight:700}
/* 본문 속 근거 문서 이름: 글 흐름을 끊지 않게 작고 흐리게, 줄 가운데 높이에 */
.doc p .cite.in{font-weight:500;font-size:.72em;color:#9b8a66;vertical-align:middle;margin:0 1px;letter-spacing:-.01em;white-space:nowrap}
.doc p .cite.in.unread{color:#b8361f;background:#f7d4c8;border-radius:2px;padding:0 2px}
.doc p.fake{background:#f7d4c8;border-left:3px solid #b8361f;padding:4px 8px}
.doc p.unused{color:#8a7a5c}
.doc .notice{font-size:12px;color:#6a5a3c;background:#eadcb7;border-radius:3px;padding:8px 10px;margin-bottom:16px;line-height:1.55;max-width:78ch}
form.ask{display:flex;gap:6px}
form.ask input{flex:1;min-width:0;background:var(--inset);border:1px solid #33464f;border-radius:4px;padding:8px 9px;font-size:13px}
form.ask input:focus-visible,.ctrl button:focus-visible,.preset:focus-visible,.fleet:focus-visible,.tog input:focus-visible,.doc button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
form.ask button{background:var(--gold);color:#17120a;border:0;border-radius:4px;padding:0 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.presets{display:grid;gap:5px;margin-top:8px}
.preset{background:var(--panel2);border:1px solid #2c3f48;border-radius:4px;padding:6px 8px;text-align:left;cursor:pointer;font-size:12.5px;line-height:1.4;display:flex;gap:7px;align-items:baseline}
.preset:hover{border-color:var(--gold-dim)}
.preset em{font-style:normal;font-size:10.5px;color:#17120a;background:var(--gold);border-radius:3px;padding:0 5px;flex:0 0 auto}
.preset small{margin-left:auto;font-size:10.5px;color:var(--muted);white-space:nowrap;padding-left:6px}
.preset.off{opacity:.55}
.preset[aria-pressed="true"]{border-color:var(--gold);background:var(--inset)}
.runs{display:grid;gap:4px;margin-top:8px}
.runbtn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;text-align:left;background:var(--inset);border:1px solid #2c3f48;border-radius:4px;padding:5px 8px;cursor:pointer;font-size:12px;line-height:1.45;color:var(--fg);font-family:inherit}
.runbtn b{color:var(--gold);font-weight:700;grid-row:span 2;align-self:center;min-width:5.5em}
.runbtn span{color:var(--muted)}
.runbtn:hover{border-color:var(--gold-dim)}
.runbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}
.runbtn.go{display:block;background:var(--gold);color:#17120a;font-weight:700;border:0;text-align:center}
.note.live{margin-top:6px}
form.ask input:disabled,form.ask button:disabled{opacity:.5;cursor:not-allowed}
.runbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.judge{margin:9px 0 0;font-size:12px;line-height:1.5;color:var(--muted);background:var(--inset);border-left:3px solid var(--gold-dim);padding:6px 8px}
.judge b{color:var(--fg)}
.tog{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:6px;cursor:pointer}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.m{background:var(--inset);border:1px solid #26363e;border-radius:4px;padding:6px 7px;display:grid;gap:1px}
.m b{font-size:16px;font-variant-numeric:tabular-nums}
.m span{font-size:11px}
.m i{font-style:normal;font-size:10px;color:var(--muted)}
.m.alarm b{color:var(--danger)} .m.good b{color:var(--ok)}
.log{font-size:12px;line-height:1.55;font-variant-numeric:tabular-nums;padding:0 12px 12px;overflow-y:auto;flex:1;min-height:120px}
.log div{border-bottom:1px solid #1f2d34;padding:2px 0}
.log .k{color:var(--gold)} .log .w{color:#ff9b86}
.below{max-width:1600px;margin:16px auto 0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.below .card{background:var(--panel);border:1px solid var(--gold-dim);border-radius:6px;min-width:0}
.corpus{padding:0 12px 12px;font-size:12.5px;line-height:1.6}
.corpus dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 8px}
.corpus dt{color:var(--muted)} .corpus dd{margin:0;font-variant-numeric:tabular-nums}
.routes{display:grid;gap:8px;padding:0 12px 12px}
.routes div{font-size:12.5px;line-height:1.55;border-left:3px solid var(--c);padding-left:9px}
.routes b{font-family:var(--f-serif)}
.note{color:var(--muted);font-size:12px;line-height:1.55;margin:0}
.ok-t{color:var(--ok)} .bad-t{color:var(--danger)}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}
  .mapwrap{height:min(66vh,640px);min-height:400px;order:1}
  .outliner{order:2;border-right:0;border-top:1px solid var(--gold-dim)}
  .panel{order:3;border-left:0;border-top:1px solid var(--gold-dim)}
  .log{max-height:260px}
  .below{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="crest" aria-hidden="true">♛</div>
    <div class="ttl"><b>대항해 리서치 해도</b></div>
    <ol class="stages" id="stages" aria-label="파이프라인 단계"><li>① 기획</li><li>② 배치</li><li>③ 조사</li><li>④ 점검</li><li>⑤ 종합</li><li>⑥ 평가</li></ol>
    <div class="res" id="res" aria-live="polite"></div>
  </header>

  <aside class="side outliner" aria-label="함대">
    <h2>함대 · 서브에이전트</h2>
    <div class="fleets" id="fleets"></div>
  </aside>

  <main class="mapwrap" id="mapwrap">
    <canvas id="map" role="img" aria-label="세계 해도: 함대가 지명 문서를 찾아 항해하는 모습"></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="event" id="event" hidden></div>
    <article class="doc" id="doc" hidden aria-label="종합 보고서"></article>
    <div class="ctrl layers" role="group" aria-label="해도 표시">
      <label for="showRoutes"><input type="checkbox" id="showRoutes" checked> 역사 항로</label>
      <label for="showLinks"><input type="checkbox" id="showLinks"> 문서 링크</label>
      <button type="button" id="openDoc" hidden>📜 보고서</button>
      <button type="button" id="music" aria-pressed="false" title="곡이 끝나면 다른 곡을 무작위로 이어 틉니다 · Musopen 녹음 (퍼블릭 도메인)">♪ 음악</button>
      <select id="track" aria-label="곡 고르기" style="background:#0f181d;color:var(--fg);border:1px solid #33464f;border-radius:3px;font-size:12px;padding:2px 4px;max-width:180px"></select>
      <span id="mstat" aria-live="polite" style="font-size:11px;color:var(--muted);max-width:220px"></span>
      <input type="range" id="vol" min="0" max="100" value="55" aria-label="음악 음량" style="width:70px">
    </div>
    <div class="ctrl speed" role="group" aria-label="진행 속도">
      <button type="button" data-s="0" aria-label="일시정지">⏸</button>
      <button type="button" data-s="1" aria-pressed="true">▶</button>
      <button type="button" data-s="2">▶▶</button>
      <button type="button" data-s="4">▶▶▶</button>
    </div>
    <div class="ctrl zoom" role="group" aria-label="확대">
      <button type="button" id="zin" aria-label="확대">＋</button>
      <button type="button" id="zout" aria-label="축소">－</button>
      <button type="button" id="zfit" aria-label="전체 보기">⟲</button>
      <button type="button" id="follow" aria-pressed="true" aria-label="함대 따라가기" title="함대 따라가기 — 움직이는 배가 화면 안에 머물게 시점을 천천히 옮깁니다">⛵</button>
    </div>
  </main>

  <aside class="side panel" aria-label="질문과 지표">
    <h2 id="hqTitle">질문 · 왕실 항해 위원회</h2>
    <div class="box">
      <form class="ask" id="askform">
        <input id="ask" name="ask" type="text" aria-label="새 질문" placeholder="새 질문" autocomplete="off" maxlength="200">
        <button type="submit" id="askBtn">출항 명령</button>
      </form>
      <p class="note live" id="liveNote"></p>
      <div class="presets" id="qlist" aria-label="질문 고르기"></div>
      <div class="runs" id="runlist" aria-label="실행 기록 고르기"></div>
      <p class="judge" id="judge"></p>
    </div>
    <h2>평가 지표</h2>
    <div class="box"><div class="metrics" id="metrics"></div></div>
    <h2>항해 일지</h2>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
</div>

<section class="below">
  <div class="card"><h2>역사 항로 · 무엇을 근거로 그렸나</h2><div class="routes" id="routes"></div></div>
  <div class="card"><h2>코퍼스 · 지명 문서</h2><div class="corpus" id="corpus"></div></div>
</section>

<script>
(() => {
'use strict';
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ro = w => { const ch = w.charCodeAt(w.length - 1) - 0xAC00; if (ch < 0 || ch > 11171) return '로'; const j = ch % 28; return j === 0 || j === 8 ? '로' : '으로'; };
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const R2D = Math.PI/180;
const km = (a, b) => { const dl = ((b[0] - a[0] + 540) % 360 - 180)*R2D, p1 = a[1]*R2D, p2 = b[1]*R2D; return 6371*2*Math.asin(Math.min(1, Math.sqrt(Math.sin((p2 - p1)/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2))); };

/* ───────── 지명 · 권역 · 묶음 ───────── */

const NATIONS = {
  pt:{name:'포르투갈', re:/포르투갈/, hq:'리스본', board:'왕실 항해 위원회', bases:['리스본','엘미나','루안다','모잠비크섬','고아','믈라카','마카오','사우바도르'],

function setStage(n){ ST.stage = n; [...$('stages').children].forEach((li, i) => { li.className = i + 1 < n ? 'done' : i + 1 === n ? 'now' : ''; }); }
function cost(tokensIn, out){ return (tokensIn*0.15 + out*0.6)/1e6*1400; } // gpt-4o-mini 단가 · ₩1,400/$
function call(kind, p){ if (ST.replay){ renderRes(); return; } ST.calls++; const t = kind === 'read' ? Math.min(p.tokens, 16000) + 120 : kind === 'plan' ? 4200 : kind === 'pick' ? 900 : kind === 'write' ? 2400 : 3600; ST.won += cost(t, kind === 'read' ? 260 : kind === 'pick' ? 30 : 700); renderRes(); }
async function sail(run, f, to){
  if (f.at === to) return;
  const from = P.get(f.at), dest = P.get(to);
  f.status = '항로 계산'; renderFleets();
  const r = await findPath(from.cell, dest.cell); if (run !== RUN) throw CANCEL;
  const pts = r.pts || [from.portLL, dest.portLL];
  const geo = [];
  const lead = from.inland || from.offshore > 45; geo.push({a:[from.lon, from.lat], b:pts[0], over:lead});
  for (let k = 1; k < pts.length; k++) geo.push({a:pts[k - 1], b:pts[k], over:false});
  geo.push({a:pts[pts.length - 1], b:[dest.lon, dest.lat], over:dest.inland || dest.offshore > 45});
  const used = Object.entries(r.used || {}).filter(([, n]) => n >= 8).sort((a, b) => b[1] - a[1]).map(([ri]) => HIST[ri].name.split(' (')[0]);
  if (used.length) log(`  ${f.name} 항로: ${used.slice(0, 3).join(' → ')}`);
  f.geo = geo; f.legs = makeLegs(geo);
  const total = f.legs.reduce((s, l) => s + l.len, 0);
  const dur = Math.max(1300, Math.min(8000, total/MW*15000));
  f.status = '항해 중'; renderFleets();
  await new Promise(res => { f.mv = {t0:simT, dur, total, res}; });
  if (run !== RUN) throw CANCEL;
  ST.trails.push({geo, legs:makeLegs(geo), color:f.color}); f.at = to; f.legs = null;
}
async function readDoc(run, f, id, round, idx, assigned){
  const ps = ST.port.get(id), p = P.get(id);
  f.status = '조사 중'; renderFleets();
  ps.reading = {f, t0:simT, dur:1500}; await W8(run, 1500); ps.reading = null;
  if (!assigned) call('pick', p);
  call('read', p);
  const dup = ps.readers.size > 0 && !ps.readers.has(f.i);
  ps.readers.add(f.i); f.read.push(id); f.used++;
  ST.reads.push({f:f.i, id, round, idx, assigned, dup});
  if (dup){ ps.dup = true; log(`  ⚠ ${f.name} «${p.name}» 중복 — 다른 함대가 이미 읽음`, 'w'); }
  else log(`  ${f.name} «${p.name}» 상륙 조사 · ${p.chars.toLocaleString()}자`);
  renderFleets();
}
function avoidFor(f, zones){ if (!zones) return new Set(); const s = new Set(); ST.fleets.forEach(g => { if (g === f) return; if (g.sec.seed) s.add(g.sec.seed); g.read.forEach(x => s.add(x)); }); return s; }
function nextDoc(f, zones){
  const read = new Set(f.read), avoid = avoidFor(f, zones), cur = P.get(f.at);
  const frontier = new Set(); f.read.forEach(id => P.get(id).links.forEach(l => frontier.add(l)));
  let cand = [...frontier].filter(id => !read.has(id) && !avoid.has(id) && id !== HQ), jump = false;
  if (!cand.length){ cand = PLACES.map(p => p.id).filter(id => !read.has(id) && !avoid.has(id) && id !== HQ); jump = true; }
  const score = id => { const p = P.get(id); return (p.region === f.sec.region ? 5 : 0) + Math.min(p.chars, 30000)/9000 + p.links.length/10 - km([cur.lon, cur.lat], [p.lon, p.lat])/3500; };

}
async function voyage(run, f, opt){
  const zones = !opt.abl;
  f.budget = opt.budget; f.used = 0;
  f.sec.status = opt.round === 2 ? '재조사' : '조사 중';
  for (let k = 0; k < opt.budget; k++){
    let id, assigned = false, jump = false;
    if (k === 0 && opt.seed){ id = opt.seed; assigned = true; }
    else if (k === 0 && opt.abl && opt.round === 1){ id = ST.hub; log(`  ${f.name} 시작 문서 없음 → 가장 이름난 «${P.get(id).name}»부터`, 'w'); }
    else { const nx = nextDoc(f, zones); if (!nx){ log(`  ${f.name} 더 읽을 후보 없음 — 그만 읽음`); break; } id = nx.id; jump = nx.jump; }
    const nm = P.get(id).name;
    if (assigned) log(`  ${f.name} 배정받은 «${nm}»${ro(nm)} 직행${P.get(id).links.length ? '' : ' (링크 없는 문서 — 배정이 유일한 길)'}`);
    else if (jump) log(`  ${f.name} 이어진 링크가 막힘 → 전체 후보에서 «${nm}» 선택`);

  f.status = '집필'; f.bubble = say('✍ 항해일지 작성', 1500); renderFleets();

  const inRegion = f.read.filter(id => P.get(id).region === f.sec.region).length;
  const ok = opt.round === 2 || ST.plan.type === '단일' || inRegion >= 2;
  f.sec.status = ok ? '충분' : '부족'; f.status = ok ? '보고 완료' : '부족 신고';
  f.sec.why = ok ? '' : `${REGION[f.sec.region]} 문서를 ${inRegion}건밖에 못 읽음`;
  ST.scrolls.push({from:{...f.b}, to:'hq', t0:simT, dur:1300, color:f.color});
  f.bubble = say(ok ? '충분 ✓' : '부족 ✗', 2600); renderFleets();

}

function planFromRun(R){
  const ev = R.events, pe = ev.find(e => e.type === 'plan');
  const base = plan(R.question); // 나라·본부·거점 판단만 빌려 오고, 목차는 기록 그대로 쓴다
  if (!pe){ // 단일 에이전트 대조군: 목차·배정 없이 함대 하나가 같은 읽기 예산으로 혼자 읽고 쓴다
    const first = (ev.find(e => e.type === 'read' && P.has(e.doc)) || {}).doc || null;
    const owner = first ? (base.nations.find(k => NATIONS[k].ports.has(first)) || null) : null;
    return {...base, q:R.question, type:'단일 에이전트', why:'단일 에이전트 대조군', sections:[{title:'단일 에이전트 (목차 없음)', region:first ? P.get(first).region : 'europe', seed:null, role:'단일 에이전트', budget:ev.filter(e => e.type === 'read').length, owner, brief:R.question}]};

    const firstRead = (ev.find(e => e.type === 'read' && e.sec === i && P.has(e.doc)) || {}).doc;

    return {title:t['절'], region:anchor ? P.get(anchor).region : 'europe', seed, role:t['역할'], budget:t['예산'] || 3, owner, brief:t['지시']};

}
async function replayVoyage(run, f, evs, round){

  f.sec.status = round > 1 ? '재조사' : '조사 중';

      if (!P.has(e.doc)) continue;
      const nm = P.get(e.doc).name;
      if (e.assigned) log(`  ${f.name} 배정받은 «${nm}»${ro(nm)} 직행${P.get(e.doc).links.length ? '' : ' (링크 없는 문서)'}`);
      await sail(run, f, e.doc);
      await readDoc(run, f, e.doc, round, k++, e.assigned);

    } else if (e.type === 'write'){

}

function mdReport(md){ // 기록된 보고서(마크다운)를 해도 위 문서로
  const read = new Set(ST.reads.map(r => r.id));
  // '…이다. «바타비아» 그 중…' 처럼 마침표 뒤에 띄어 붙은 인용은 앞 문장에 바짝 붙인다 (뒤 문장 것으로 보이지 않게)
  const cite = t => esc(t).replace(/([.!?。])\s+((?:«[^»]+»[\s,]*)+)/g, (_, pt, cs) => pt + cs.trim() + ' ').replace(/«([^»]+)»/g, (_, n) => `<span class="cite in${P.has(n) && !read.has(n) ? ' unread' : ''}">«${n}»</span>`);
  let html = '', sec = -1;
  for (const blk of md.split(/\n\s*\n/)){
    const b = blk.trim(); if (!b || b.startsWith('# ')) continue;
    if (b.startsWith('## ')){ sec++; const lines = b.split('\n'); const f = ST.fleets[sec];
      html += `<section style="--c:${f ? f.color : '#999'}"><h4><i></i>${esc(lines[0].slice(3))}</h4>${f ? `<div class="who">${esc(f.name)} · ${esc(f.sec.role)} · ${esc(P.get(f.base).name)}에서 출항 · ${f.read.length}곳 조사</div>` : ''}<p>${cite(lines.slice(1).join(' '))}</p></section>`; }
    else html += `<p>${cite(b)}</p>`;
  }
  return html;
}

function metrics(fakeDoc, abl){
  const reads = ST.reads, att = reads.length || 1, uniq = new Set(reads.map(r => r.id)).size;
  const c = new Map(); reads.forEach(r => { const w = r.round === 1 ? ([3, 2, 1][r.idx] ?? 1) : [2, 0][r.idx]; if (w) c.set(r.id, (c.get(r.id) || 0) + w); });
  const total = [...c.values()].reduce((a, b) => a + b, 0) + (fakeDoc ? 1 : 0);
  const sub = reads.reduce((s, r) => s + Math.min(P.get(r.id).chars, 60000), 0), coord = 12000 + 900*ST.fleets.length;
  let h = 0; for (const ch of ST.plan.q) h = (h*31 + ch.charCodeAt(0)) % 997;
  return {ground:Math.round(((abl ? 62 : 78) + (h % 60)/10)*10)/10, fake:fakeDoc ? 1 : 0, unused:[...new Set(reads.map(r => r.id))].filter(id => !c.has(id)).length,
    bias:total ? Math.round(1000*Math.max(...c.values())/total)/10 : 0, dup:Math.round(1000*(1 - uniq/att))/10, iso:Math.round(1000*coord/(coord + sub))/10};
}

/* ───────── 그리기 (성능: 지도 바탕은 캐시, 조작 중엔 캐시를 옮겨 그리고 멈추면 고화질로) ───────── */

function sprite(key, w, h, paint){ // 한 번 그린 글자·빛 번짐·배 몸체를 재사용

  const c = document.createElement('canvas'); c.width = Math.ceil(w*DPR); c.height = Math.ceil(h*DPR); const g = c.getContext('2d'); g.scale(DPR, DPR); paint(g);
  s = {c, w, h}; if (spriteCache.size > 900) spriteCache.clear(); spriteCache.set(key, s); return s;
}
function renderBase(){
  const showR = $('showRoutes').checked;

  ['loadstart','waiting','playing','pause','stalled','suspend','canplay'].forEach(ev => el.addEventListener(ev, () => stat({loadstart:'불러오는 중…', waiting:'불러오는 중…', playing:`재생 중 (${mode === 'direct' ? '직접' : '우회'})`, pause:on ? '멈춤' : '', stalled:'받는 중 멈춤…', suspend:el.readyState >= 3 ? '' : '대기', canplay:'재생 준비됨'}[ev] ?? '')));
  const why = e => { const c = e && e.code; return c === 4 ? '이 브라우저가 ogg 음원을 지원하지 않거나 음원 접근이 막혔습니다.' : c === 3 ? '음원을 해독하지 못했습니다.' : c === 2 ? '음원을 내려받지 못했습니다 (네트워크).' : `음원을 재생하지 못했습니다${e && e.message ? ` (${e.message})` : ''}.`; };
  const ramp = (to, ms, done) => { cancelAnimationFrame(fade); const from = el.volume, t0 = performance.now();
    const st = now => { const k = Math.min(1, (now - t0)/ms); el.volume = Math.max(0, Math.min(1, from + (to - from)*k)); if (k < 1) fade = requestAnimationFrame(st); else if (done) done(); }; fade = requestAnimationFrame(st); };
  async function srcOf(t){
    if (mode === 'direct') return t.src;
    if (!blobs[t.src]){ stat('음원 받는 중 (우회)…'); const r = await fetch(t.src); if (!r.ok) throw new Error('HTTP ' + r.status); blobs[t.src] = URL.createObjectURL(new Blob([await r.blob()], {type:'audio/ogg'})); }
    return blobs[t.src];
  }
  async function load(i){ idx = i; $('track').value = String(i); el.src = await srcOf(TRACKS[i]); }
  async function playFromStart(){
    el.volume = 0;
    try { await el.play(); }
    catch (e){
      if (e && e.name === 'NotAllowedError') throw e;   // 자동 재생 정책으로 막힌 것은 우회 대상이 아니다
      if (mode !== 'direct') throw e;
      stat(`직접 재생 실패(${e.name || e.message}) → 우회 시도…`); mode = 'blob'; await load(idx); await el.play();   // 직접 재생이 막혔으면 한 번만 우회
    }
    ramp(vol, 1500);
  }
  el.addEventListener('ended', () => { if (on) next(); });
  el.addEventListener('error', async () => {
    if (!on) return;
    if (mode === 'direct'){ try { mode = 'blob'; await load(idx); await playFromStart(); } catch (e){ fail(why(el.error || e)); } }
    else fail(why(el.error));
  });
  function fail(msg){ on = false; el.pause(); setBtn(); showEvent('음악', msg); stat('실패: ' + msg); }
  async function next(){ let j = idx; if (TRACKS.length > 1) while (j === idx) j = Math.floor(Math.random()*TRACKS.length); try { await load(j); await playFromStart(); } catch (e){ fail(why(e)); } }
  return {
    async toggle(){
      on = !on; userOff = !on;
      if (!on){ ramp(0, 600, () => el.pause()); return; }
      try { if (!el.src) await load(idx); await playFromStart(); } catch (e){ fail(why(el.error || e)); }
    },
    async pick(i){ if (!on){ idx = i; el.removeAttribute('src'); return; } ramp(0, 500, async () => { el.pause(); try { await load(i); await playFromStart(); } catch (e){ fail(why(e)); } }); },
    volume(v){ vol = v; if (on) el.volume = v; },
    get on(){ return on; },
    async auto(){ // 기본값: 열자마자 재생. 브라우저가 막으면 화면을 처음 누르는 순간 시작한다.
      if (on) return; on = true;
      try { if (!el.src) await load(idx); await playFromStart(); }
      catch (e){
        on = false;
        if (!(e && e.name === 'NotAllowedError')){ fail(why(el.error || e)); return; }
        stat('화면을 한 번 누르면 음악이 시작됩니다');
        const go = ev => { document.removeEventListener('pointerdown', go, true); document.removeEventListener('keydown', go, true);
          if (userOff || on || (ev.target && ev.target.closest && ev.target.closest('#music'))) return; // 음악 버튼은 버튼이 알아서
          Music.toggle().then(setBtn); setBtn(); };
        document.addEventListener('pointerdown', go, true); document.addEventListener('keydown', go, true);
      }
    },
  };
})();
function setBtn(){ $('music').setAttribute('aria-pressed', Music.on ? 'true' : 'false'); $('music').textContent = Music.on ? '♪ 음악 끄기' : '♪ 음악'; }
$('track').innerHTML = TRACKS.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join('');
$('track').onchange = e => Music.pick(+e.target.value);
$('music').onclick = async () => { const p = Music.toggle(); setBtn(); await p; setBtn(); };
$('vol').oninput = e => Music.volume(+e.target.value/100);
Music.auto().then(setBtn); setBtn();

/* ───────── 조작 ───────── */
/* ───────── 질문 · 실행 기록 고르기 — 화면은 실제 LLM 실행만 보여 준다 ───────── */
let RUNS = DATA.runs || [];        // 실제 LLM 실행 기록 (최신순). app.py 로 열면 서버에서 새로 받는다
let LIVE = null;                   // app.py 로 열었을 때만 {live, busy, today_won, daily_won, runs_left}
let selQ = null;
const QS = DATA.questions || [];
const runsOf = q => RUNS.filter(r => r.question === q);
const verName = v => String(v || '').replace(/^\d{4}-\d{2}-\d{2}/, '') || v;
function qKeys(){ // 질문 세트 10개 + 기록에만 있는 직접 질문
  const extra = [...new Set(RUNS.map(r => r.question))].filter(q => !QS.some(x => x.q === q));
  return [...QS.map(x => ({q:x.q, tag:x.type})), ...extra.map(q => ({q, tag:'직접'}))];
}
const pickDefault = list => list.find(r => r.cond === '전체') || list[0];
function renderQList(){
  $('qlist').innerHTML = qKeys().map((x, i) => { const n = runsOf(x.q).length;
    return `<button type="button" class="preset${n ? '' : ' off'}" data-q="${i}" aria-pressed="${x.q === selQ}"><em>${esc(x.tag)}</em><span>${esc(x.q)}</span><small>${n ? `기록 ${n}` : '기록 없음'}</small></button>`; }).join('');
}
function renderRunList(){
  const box = $('runlist'); if (!selQ){ box.innerHTML = ''; return; }
  const list = runsOf(selQ), on = !!(LIVE && LIVE.live);
  if (!list.length){
    box.innerHTML = on ? `<p class="note">이 질문은 아직 실제로 돌린 기록이 없습니다.</p><button type="button" class="runbtn go" id="runThis">이 질문을 실제 LLM으로 돌리기</button>`
      : `<p class="note">이 질문은 아직 실제로 돌린 기록이 없습니다. 새 실행은 API 키가 있는 서버(app.py)에서만 됩니다.</p>`;
    return;
  }
  const cur = ST && ST.replay ? ST.replay.run_id : '';
  box.innerHTML = `<p class="note">실제 실행 ${list.length}개 — 누르면 기록 그대로 재생합니다</p>` + list.map(r =>
    `<button type="button" class="runbtn" data-run="${esc(r.run_id)}" aria-pressed="${r.run_id === cur}"><b>${esc(r.cond)}</b><span>${esc(r.time)} · 판 ${esc(verName(r.version))}</span><span>근거율 ${r.ground ?? '—'}% · ₩${r.won ?? '?'}</span></button>`).join('');
}
function applyLive(){
  const on = !!(LIVE && LIVE.live);
  $('ask').disabled = !on; $('askBtn').disabled = !on || !!(LIVE && LIVE.busy);
  $('ask').placeholder = on ? '새 질문 — 실제 LLM으로 조사합니다' : '새 질문은 키가 있는 서버(app.py)에서만';
  $('liveNote').innerHTML = on
    ? `새 질문은 실제 gpt-4o-mini로 돌립니다 (1회 약 ₩5, 1~2분). 오늘 ₩${LIVE.today_won} / ₩${LIVE.daily_won} · 이 접속 남은 횟수 ${LIVE.runs_left}${LIVE.busy ? ' · 지금 다른 질문을 조사 중' : ''}`
    : (LIVE ? '이 서버에는 API 키가 없어 기록 재생만 됩니다.' : '이 페이지는 실제 LLM으로 돌린 기록만 재생합니다. 질문을 고르고 실행 기록을 누르세요.');
  renderRunList();
}
async function refreshHealth(){ try { const r = await fetch('api/health', {cache:'no-store'}); if (r.ok){ LIVE = await r.json(); applyLive(); } } catch {} }

function start(R){
  RUN++; waiters = []; simT = 0;
  CUR = planFromRun(R); newState(CUR); ST.replay = R;
  $('log').innerHTML = ''; $('event').hidden = true; $('doc').hidden = true; $('openDoc').hidden = true; $('judge').textContent = '기록을 불러오는 중…';
  setStage(0); renderFleets(); renderRes(); renderMetrics(); dirty = true;
  selQ = R.question; renderQList(); renderRunList();
  const run = RUN; replayStory(run).catch(e => { if (e !== CANCEL) console.error(e); });
}

// app.py: 새 질문을 실제 LLM으로 돌리고, 진행을 기록 파일에서 받아 보여 준 뒤, 끝나면 그 기록을 그대로 재생한다
function liveLine(e){
  const sec = i => `${(i ?? 0) + 1}절`;
  if (e.type === 'plan'){ setStage(2); if (e.out_of_scope) log(`① 기획: 범위 밖 — ${e.out_of_scope}`, 'w'); else log(`① 기획 목차 ${e.toc.length}절 · ` + e.toc.map(t => `${t['역할']}→«${t['시작문서'] || '자율'}»`).join(' · '), 'k'); }
  else if (e.type === 'fix') log(`   코드가 배정을 바로잡음: «${e.given}» → «${e.used || '없음'}»`, 'w');
  else if (e.type === 'read'){ setStage(3); log(`  ${sec(e.sec)} «${e.doc}» 읽음${e.irrelevant ? ' — 관련 없음' : ''}${e.round > 1 ? ' (재위임)' : ''}`, e.irrelevant ? 'w' : ''); }
  else if (e.type === 'write') log(`  ${sec(e.sec)} 원고 ${e.chars}자 · 인용 ${e.cites}곳 · ${e.enough ? '충분' : '부족 신고'}`);
  else if (e.type === 'recite') log(`  ${sec(e.sec)} 인용이 빠진 원고를 한 번 되돌려 씀 (${e.before} → ${e.after})`);
  else if (e.type === 'review'){ setStage(4); log(`④ 점검 — ${e.gaps.length ? `${e.gaps.length}절 재위임` : e.reason}`, 'k'); }
  else if (e.type === 'synth'){ setStage(5); log('⑤ 종합', 'k'); }
  else if (e.type === 'evaluate'){ setStage(6); log('⑥ 평가', 'k'); }
  else if (e.type === 'abort') log(`멈춤: ${e.reason}`, 'w');
}
async function ask(q){
  $('askBtn').disabled = true;
  let r, j;
  try { r = await fetch('api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})}); j = await r.json(); }
  catch { $('liveNote').textContent = '서버에 닿지 못했습니다.'; $('askBtn').disabled = false; return; }
  if (!r.ok){ await refreshHealth(); $('liveNote').innerHTML = `<b style="color:#ff9b86">${esc(j.error || '실행을 시작하지 못했습니다.')}</b>`; return; }
  watch(j.run_id, q);
}
async function watch(runId, q){
  RUN++; const my = RUN; waiters = []; simT = 0;
  CUR = {...plan(q), q, sections:[], type:'실행 중', why:''}; newState(CUR); ST.replay = null;
  $('log').innerHTML = ''; $('event').hidden = true; $('doc').hidden = true; $('openDoc').hidden = true;
  setStage(1); renderFleets(); renderRes(); renderMetrics(); dirty = true;
  selQ = q; renderQList(); $('runlist').innerHTML = '';
  ST.hqBubble = say('목차 짜는 중…', 600000);
  log(`질문 접수: ${q}`, 'k'); log('실제 LLM(gpt-4o-mini)으로 조사합니다. 끝나면 이 실행 기록을 해도에서 그대로 재생합니다.');
  const t0 = performance.now(); let seen = 0;
  while (my === RUN){
    await new Promise(res => setTimeout(res, 1200));
    if (my !== RUN) break;
    let j; try { j = await (await fetch('api/job?run_id=' + encodeURIComponent(runId), {cache:'no-store'})).json(); } catch { continue; }
    for (const e of (j.events || []).slice(seen)) liveLine(e);
    seen = (j.events || []).length;
    $('judge').innerHTML = `<b>실제 LLM 실행 중</b> · ${Math.round((performance.now() - t0)/1000)}초 · 기록된 사건 ${seen}개 · 실행 <code>${esc(runId)}</code>`;
    if (j.status === 'done' && j.record){ RUNS = [j.record, ...RUNS.filter(x => x.run_id !== j.record.run_id)]; await refreshHealth(); start(j.record); return; }
    if (j.status === 'error'){ log(`실행 실패: ${j.error}`, 'w'); $('judge').innerHTML = `<b>실행 실패</b> · ${esc(j.error)}`; ST.hqBubble = null; await refreshHealth(); return; }
  }
  refreshHealth();
}

$('qlist').addEventListener('click', e => { const b = e.target.closest('.preset'); if (!b) return; const x = qKeys()[+b.dataset.q]; selQ = x.q; $('ask').value = x.q;
  const list = runsOf(x.q); if (list.length) start(pickDefault(list)); else { renderQList(); renderRunList(); } });
$('runlist').addEventListener('click', e => { if (e.target.closest('#runThis')){ ask(selQ); return; }
  const b = e.target.closest('.runbtn[data-run]'); if (!b) return; const R = RUNS.find(x => x.run_id === b.dataset.run); if (R) start(R); });
$('askform').addEventListener('submit', e => { e.preventDefault(); const q = $('ask').value.trim(); if (q && LIVE && LIVE.live) ask(q); });
$('showRoutes').onchange = () => { baseKey = ''; dirty = true; };
$('showLinks').onchange = () => { dirty = true; };
$('openDoc').onclick = () => { $('doc').hidden = false; };
document.querySelectorAll('.speed button').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); });
function zoomAt(f, sx, sy){ const k0 = view.k; view.k = Math.max(1, Math.min(10, view.k*f)); const r = view.k/k0; view.x = sx - (sx - view.x)*r; view.y = sy - (sy - view.y)*r; clampView(); lastInteract = userMoved = performance.now(); }
$('zin').onclick = () => zoomAt(1.5, W/2, H/2); $('zout').onclick = () => zoomAt(1/1.5, W/2, H/2); $('zfit').onclick = () => { userMoved = performance.now(); fitView(); };
$('follow').onclick = () => { follow = !follow; $('follow').setAttribute('aria-pressed', String(follow)); if (follow) userMoved = -1e9; };
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.18 : 1/1.18, e.clientX - r.left, e.clientY - r.top); }, {passive:false});
let drag = null, moved = 0;
cv.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; moved = 0; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag){ moved += Math.abs(e.movementX) + Math.abs(e.movementY); view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; clampView(); lastInteract = userMoved = performance.now(); }
  let best = null, bd = 12; for (const p of PLACES){ const s = toScr(p.b), d = Math.hypot(s.x - mx, s.y - my); if (d < bd){ bd = d; best = p; } }
  const hv = best ? best.id : null; if (hv !== ST.hover){ ST.hover = hv; dirty = true; }
  const tip = $('tip');
  if (best && !drag){ const ps = ST.port.get(best.id); tip.innerHTML = `<b>${esc(best.name)}</b><span>${esc(best.title)} · ${esc(GROUP[best.group] || '')}</span><br>${best.chars.toLocaleString()}자 · ${best.tokens.toLocaleString()}토큰 · ${esc(best.source)}<br>다른 지명으로 가는 링크 ${best.links.length}개${best.inland ? ' · 내륙 (상륙 행군)' : ''}${ALL_BASES.has(best.id) ? ' · 출항 거점' : ''}${ps.readers.size ? `<br>읽은 함대: ${[...ps.readers].map(i => SHIPS[i]).join(', ')}` : ''}`; tip.hidden = false; tip.style.left = Math.min(W - 280, mx + 14) + 'px'; tip.style.top = Math.min(H - 120, my + 12) + 'px'; }
  else tip.hidden = true;
});
cv.addEventListener('pointerup', () => { if (drag && moved < 5){ ST.sel = ST.hover && ST.sel !== ST.hover ? ST.hover : null; dirty = true; } drag = null; cv.classList.remove('drag'); });
cv.addEventListener('pointerleave', () => { if (ST.hover){ ST.hover = null; dirty = true; } $('tip').hidden = true; });
$('fleets').addEventListener('click', e => { const b = e.target.closest('.fleet'); if (!b) return; const f = ST.fleets[+b.dataset.i]; view.k = Math.max(view.k, 2.6); view.x = W/2 - f.b.x*view.k; view.y = H/2 - f.b.y*view.k; clampView(); });
// 점검용: 무작위 항구 쌍의 항로가 바다로만 가는지 센다 (상륙 행군 구간은 제외)
const segOnSea = (a, b) => { let [lo1, la1] = a, [lo2, la2] = b; if (Math.abs(lo2 - lo1) > 180) lo2 += lo2 < lo1 ? 360 : -360; const n = Math.max(2, Math.ceil(Math.hypot(lo2 - lo1, la2 - la1)/.05)); for (let t = 1; t < n; t++){ let lo = lo1 + (lo2 - lo1)*t/n; if (lo > 180) lo -= 360; if (lo < -180) lo += 360; if (!isSea(cellOf(lo, la1 + (la2 - la1)*t/n))) return false; } return true; };
window.__checkRoutes = async (n = 60) => { let segs = 0, bad = 0, fail = 0; const ex = []; let s = 11; const rnd = () => (s = (s*16807) % 2147483647)/2147483647;
  for (let i = 0; i < n; i++){ const a = PLACES[Math.floor(rnd()*PLACES.length)], b = PLACES[Math.floor(rnd()*PLACES.length)]; if (a === b) continue; const r = await findPath(a.cell, b.cell); if (!r.pts){ fail++; continue; }
    for (let k = 1; k < r.pts.length; k++){ segs++; if (!segOnSea(r.pts[k - 1], r.pts[k])){ bad++; if (ex.length < 5) ex.push(`${a.name}→${b.name} ${JSON.stringify(r.pts[k - 1])}→${JSON.stringify(r.pts[k])}`); } } }
  const hist = HIST.reduce((acc, h) => { for (let k = 1; k < h.pts.length; k++){ acc.n++; if (!segOnSea(h.pts[k - 1], h.pts[k])) acc.bad++; } return acc; }, {n:0, bad:0});
  return {pairs:n, segments:segs, landSegments:bad, noPath:fail, examples:ex, histSegments:hist.n, histLand:hist.bad}; };
let rzT = 0; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });
resize(); renderCorpus();
(function boot(){
  const q4 = (QS.find(x => x.id === 'Q4') || {}).q, first = (q4 && runsOf(q4).length) ? pickDefault(runsOf(q4)) : RUNS[0];
  applyLive(); if (first) start(first); else renderQList();
  (async () => { try { const r = await fetch('api/health', {cache:'no-store'}); if (!r.ok) return; LIVE = await r.json();
    const rr = await fetch('api/runs', {cache:'no-store'}); if (rr.ok) RUNS = await rr.json(); renderQList(); applyLive(); } catch {} })();
})();
requestAnimationFrame(frame);
})();
